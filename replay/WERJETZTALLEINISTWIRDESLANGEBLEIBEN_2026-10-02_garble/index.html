<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:,">
  <title>Solivault</title>
  
  <script>
    (() => {
      const originalFetch = window.fetch.bind(window);
      window.fetch = (input, init) => {
        const url = typeof input === 'string' ? input : (input && input.url) || '';
        if (url.includes('/start.png')) {
          // The live renderer extracts the second PNG itself; supply the packed file.
          return originalFetch('start.png', init);
        }
        return originalFetch(input, init);
      };
      document.addEventListener('contextmenu', event => event.preventDefault());
    })();
  </script>
  <style>

@font-face {
font-family: 'Saira Condensed';
src: local('Saira Condensed Regular'),
local('SairaCondensed-Regular'),
url('SairaCondensed-Regular.ttf') format('truetype');
font-weight: 400;
font-style: normal;
font-display: swap;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

html, body {
width: 100%;
height: 100%;
overflow: hidden;
background: #020308;
font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
color: #e5e5e5;
user-select: none;
-webkit-user-select: none;
-webkit-touch-callout: none;
}


#crt-vignette {
position: fixed;
inset: 0;
pointer-events: none;
z-index: 300;
background: radial-gradient(ellipse 72% 62% at 50% 50%,
rgba(0, 0, 0, 0) 40%,
rgba(0, 0, 0, 0.32) 64%,
rgba(0, 0, 0, 0.62) 86%,
rgba(0, 0, 0, 0.90) 100%);
}


#haze-layer {
position: absolute;
inset: 0;
pointer-events: none;
background: rgba(132, 36, 40, 0.151);
z-index: 7;
}

#stage {
position: absolute;
inset: 0;
overflow: hidden;
z-index: 10;
}

#swept-top-layer {
position: absolute;
inset: 0;
pointer-events: none;

background: linear-gradient(180deg,
rgba(134, 45, 52, 0.20) 0%,
rgba(118, 39, 39, 0.42) 40%,
rgba(118, 39, 39, 0.38) 62%,
rgba(82, 23, 23, 0.55) 100%);
z-index: 7;
}


#fog-canvas {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
pointer-events: none;
image-rendering: pixelated;
z-index: 7;
}

#displace-canvas {
position: absolute;
left: 0;
top: 0;
width: 100%;
height: 100%;
pointer-events: none;
image-rendering: pixelated;
z-index: 6;
}

#fx-canvas {
position: absolute;
left: 0;
top: 0;
width: 100%;
height: 100%;
pointer-events: none;
image-rendering: pixelated;
z-index: 8;
}


#garble-canvas {
position: fixed;
inset: 0;
width: 100vw;
height: 100vh;
pointer-events: none;
z-index: 100;
}


#scanline-canvas {
position: fixed;
inset: 0;
width: 100vw;
height: 100vh;
pointer-events: none;
z-index: 90;
}

#scaler {
position: fixed;
left: 0;
top: 0;
width: 1920px;
height: 1080px;
transform-origin: 0 0;
overflow: hidden;
}


#vignette {
position: absolute;
inset: 0;
pointer-events: none;
z-index: 6;
background: radial-gradient(ellipse 52% 60% at 50% 50%,
rgba(2, 3, 8, 0) 30%,
rgba(2, 3, 8, 0.15) 55%,
rgba(2, 3, 8, 0.45) 75%,
rgba(2, 3, 8, 0.70) 90%,
rgba(2, 3, 8, 0.86) 100%);
}


#dim-layer {
position: fixed;
inset: 0;
pointer-events: none;
z-index: 200;
background: rgba(0, 0, 0, 0.15);
}
</style>
</head>
