<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Fence?</title>
<style>
  @font-face {
    font-family: "Saira Condensed";
    src: url("SairaCondensed-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }

  * { box-sizing: border-box; }

  :root {
    --fs: min(3.36vw, 12vh);
  }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Saira Condensed", "Arial Narrow", Arial, sans-serif;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url("https://c9.gaoice.run/background_JUSTENGAGEWTH.png");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    pointer-events: none;
  }

  .stage {
    position: relative;
    z-index: 1;
    display: inline-block;
    font-size: var(--fs);
    line-height: 1;
  }

  #tri {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .slogan {
    position: relative;
    margin: 0;
    font-family: "Saira Condensed", "Arial Narrow", Arial, sans-serif;
    font-size: calc(var(--fs) * 0.48);
    font-weight: 400;
    letter-spacing: 0.08em;
    white-space: pre;
    color: #fff;
    text-shadow:
      0 0 2px rgba(103, 240, 229, 0.95),
      0 0 5px rgba(103, 240, 229, 0.85),
      0 0 10px rgba(103, 240, 229, 0.55),
      0 0 16px rgba(103, 240, 229, 0.30);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    outline: none;
  }

  .toast {
    position: fixed;
    left: 50%;
    top: calc(50% + var(--fs) * 1.7);
    transform: translateX(-50%);
    z-index: 2;
    font-family: "Saira Condensed", "Arial Narrow", Arial, sans-serif;
    font-size: calc(var(--fs) * 0.3);
    letter-spacing: 0.35em;
    color: rgba(255, 255, 255, 0.8);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
  }

  @media (orientation: portrait) {
    :root {
      --fs: min(3.36vh, 12vw);
    }

    html {
      overflow: hidden;
      height: 100%;
    }

    body {
      position: fixed;
      top: 0;
      left: 100vw;
      width: 100vh;
      height: 100vw;
      transform: rotate(90deg);
      transform-origin: top left;
    }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <canvas id="tri"></canvas>
  <div class="stage">
    <h1 class="slogan" id="slogan" tabindex="0" role="button">This is not something you were meant to know. It is, in truth, something you have known all along.</h1>
  </div>
  <div class="toast" id="toast" aria-live="polite"></div>

  <script type="4217dcd8bae1c72cca2a218a-text/javascript">
    (function () {
      const slogan = document.getElementById('slogan');
      const toast = document.getElementById('toast');
      let curIndex = 0;
      let pendingCopy = "eXcU";
      let hideTimer;

      function fetchCopy() {
        if (!window.fetch) { return Promise.resolve(''); }
        let fp = '';
        try { fp = fingerprint(); } catch (e) { }
        const url = 'api.php?act=copy' + (fp ? '&fp=' + encodeURIComponent(fp) : '');
        return fetch(url, { cache: 'no-store', credentials: 'same-origin' })
          .then(function (r) { return r.json(); })
          .then(function (d) { return (d && d.ok === true && typeof d.c === 'string') ? d.c : ''; })
          .catch(function () { return ''; });
      }

      function decodeCopy(s) {
        if (!s) { return ''; }
        let t = s.replace(/-/g, '+').replace(/_/g, '/');
        while (t.length % 4) { t += '='; }
        let bin;
        try { bin = atob(t); } catch (e) { return ''; }
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) {
          bytes[i] = bin.charCodeAt(i) ^ (0x37 + (i % 29));
        }
        try { return new TextDecoder('utf-8').decode(bytes); }
        catch (e) {
          let pct = '';
          for (let j = 0; j < bytes.length; j++) {
            pct += '%' + (bytes[j] < 16 ? '0' : '') + bytes[j].toString(16);
          }
          try { return decodeURIComponent(pct); } catch (e2) { return ''; }
        }
      }

      function flash(ms) {
        toast.classList.add('show');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => toast.classList.remove('show'), ms || 1200);
      }

      async function copyText(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (e) { }

        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        ta.remove();
        return ok;
      }

      async function handleCopy() {
        let enc = pendingCopy;
        pendingCopy = '';
        if (!enc) {
          enc = await fetchCopy();
        }
        let payload = decodeCopy(enc) || slogan.textContent;
        let ok = false;
        try {
          ok = await copyText(payload);
        } finally {
          payload = '';
        }
        toast.textContent = ok ? 'Copied' : 'Copy failed';
        flash(ok ? 1200 : 2200);
      }

      slogan.addEventListener('click', handleCopy);

      slogan.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          handleCopy();
        }
      });

      function fnv(str, seed) {
        let h = seed >>> 0;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619) >>> 0;
        }
        return h >>> 0;
      }

      function hex8(n) {
        return ('0000000' + n.toString(16)).slice(-8);
      }

      function fingerprint() {
        const p = [];
        p.push(navigator.userAgent || '');
        p.push(navigator.language || '');
        p.push((navigator.languages || []).join(','));
        p.push(navigator.platform || '');
        p.push('hc' + (navigator.hardwareConcurrency || 0));
        p.push('dm' + (navigator.deviceMemory || 0));
        p.push('mt' + (navigator.maxTouchPoints || 0));
        p.push('sc' + screen.width + 'x' + screen.height + 'x' + screen.colorDepth + 'x' + (window.devicePixelRatio || 1));
        p.push('tz' + new Date().getTimezoneOffset());

        try {
          p.push('zone' + Intl.DateTimeFormat().resolvedOptions().timeZone);
        } catch (e) {
          p.push('zone?');
        }

        try {
          const c = document.createElement('canvas');
          c.width = 200;
          c.height = 40;
          const ctx = c.getContext('2d');
          ctx.textBaseline = 'top';
          ctx.font = "16px 'Arial'";
          ctx.fillStyle = '#f60';
          ctx.fillRect(0, 0, 100, 20);
          ctx.fillStyle = '#069';
          ctx.fillText('ARG-fp-1234', 2, 4);
          ctx.fillStyle = 'rgba(102,204,0,0.7)';
          ctx.fillText('ARG-fp-1234', 4, 6);
          p.push('cv' + c.toDataURL().slice(-80));
        } catch (e) {
          p.push('cv?');
        }

        try {
          const gl = document.createElement('canvas').getContext('webgl');
          const dbg = gl.getExtension('WEBGL_debug_renderer_info');
          p.push('gv' + gl.getParameter(dbg ? dbg.UNMASKED_VENDOR_WEBGL : gl.VENDOR));
          p.push('gr' + gl.getParameter(dbg ? dbg.UNMASKED_RENDERER_WEBGL : gl.RENDERER));
        } catch (e) {
          p.push('gl?');
        }

        const s = p.join('|');
        return hex8(fnv(s, 2166136261)) + hex8(fnv(s, 1099511628)) + hex8(fnv(s + '#2', 2166136261)) + hex8(fnv(s + '#3', 1099511628));
      }

      function syncFromServer() {
        if (!window.fetch) {
          return;
        }

        let fp;
        try {
          fp = fingerprint();
        } catch (e) {
          return;
        }

        fetch('api.php?fp=' + encodeURIComponent(fp), { cache: 'no-store', credentials: 'same-origin' })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d || d.ok !== true) {
              return;
            }
            if (typeof d.index === 'number' && typeof d.text === 'string' && d.index !== curIndex) {
              curIndex = d.index;
              slogan.textContent = d.text;
            }
            if (typeof d.c === 'string' && d.c) {
              pendingCopy = d.c;
            }
          })
          .catch(function () { });
      }

      syncFromServer();

      const triCanvas = document.getElementById('tri');
      const tctx = triCanvas.getContext('2d');
      let triW = 0, triH = 0;
      let isPortrait = false;
      const TRI_SPEED = 63;
      const TRI_SPEED_LANDSCAPE = 72;
      const TRI_SCALE_PORTRAIT = 0.75;
      const TRI_SCALE_LANDSCAPE = 0.8;

      function resizeTri() {
        isPortrait = window.innerHeight > window.innerWidth;
        triW = triCanvas.width = isPortrait ? window.innerHeight : window.innerWidth;
        triH = triCanvas.height = isPortrait ? window.innerWidth : window.innerHeight;
      }
      resizeTri();
      window.addEventListener('resize', resizeTri);

      const tris = [];

      function spawnTri() {
        const h0 = 15 + Math.random() * 15;
        const scale = isPortrait ? TRI_SCALE_PORTRAIT : TRI_SCALE_LANDSCAPE;
        const h = h0 * scale;
        const side = h * 2 / Math.sqrt(3);
        const dir = Math.random() < 0.5 ? 1 : -1;
        tris.push({
          x: dir > 0 ? -side : triW + side,
          y: triH * (Math.random() + Math.random()) / 2,
          h0: h0,
          side: side,
          h: h,
          up: true,
          dir: dir,
          speed: isPortrait ? TRI_SPEED : TRI_SPEED_LANDSCAPE,
          alpha: 0.18 + Math.random() * 0.2
        });
      }

      let triLast = performance.now();
      let triNextSpawn = triLast + 150;

      function triFrame(now) {
        const dt = Math.min((now - triLast) / 1000, 0.1);
        triLast = now;

        const curSpeed = isPortrait ? TRI_SPEED : TRI_SPEED_LANDSCAPE;
        const curScale = isPortrait ? TRI_SCALE_PORTRAIT : TRI_SCALE_LANDSCAPE;
        const spawnGap = (triW + 80) / curSpeed * 1000 / 30;
        if (now >= triNextSpawn) {
          if (tris.length < 30) {
            spawnTri();
          }
          triNextSpawn = now + spawnGap * (0.8 + Math.random() * 0.4);
        }

        tctx.clearRect(0, 0, triW, triH);
        for (let i = tris.length - 1; i >= 0; i--) {
          const t = tris[i];
          t.speed = curSpeed;
          t.h = t.h0 * curScale;
          t.side = t.h * 2 / Math.sqrt(3);
          t.x += t.speed * t.dir * dt;
          if (t.x > triW + t.side || t.x < -t.side) {
            tris.splice(i, 1);
            continue;
          }
          const half = t.side / 2;
          tctx.beginPath();
          if (t.up) {
            tctx.moveTo(t.x, t.y - t.h / 2);
            tctx.lineTo(t.x + half, t.y + t.h / 2);
            tctx.lineTo(t.x - half, t.y + t.h / 2);
          } else {
            tctx.moveTo(t.x, t.y + t.h / 2);
            tctx.lineTo(t.x + half, t.y - t.h / 2);
            tctx.lineTo(t.x - half, t.y - t.h / 2);
          }
          tctx.closePath();
          tctx.fillStyle = 'rgba(255, 255, 255, ' + t.alpha + ')';
          tctx.fill();
        }

        requestAnimationFrame(triFrame);
      }
      requestAnimationFrame(triFrame);
    })();
