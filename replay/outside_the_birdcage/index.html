<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="hint" content="To our non-Chinese players: during our review, we found an information gap between mainland China and overseas that may leave you stuck on the puzzles. 
If you've made it this far but have no idea how to proceed, visit Bilibili and browse the Phigros official account's past posts. Earlier puzzles may give you the inspiration you need.">
<title>Birdcage</title>
<style>
  @font-face {
    font-family: "Saira Condensed";
    src: url("SairaCondensed-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }

  * { box-sizing: border-box; }

  :root {
    --fs: min(3.36vw, 12vh);
  }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Saira Condensed", "Arial Narrow", Arial, sans-serif;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url("background-7-7.png");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    pointer-events: none;
  }

  .stage {
    position: relative;
    z-index: 1;
    display: inline-block;
    font-size: var(--fs);
    line-height: 1;
  }

  #tri {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .slogan {
    position: relative;
    margin: 0;
    font-family: "Saira Condensed", "Arial Narrow", Arial, sans-serif;
    font-size: calc(var(--fs) * 0.48);
    font-weight: 400;
    letter-spacing: 0.08em;
    white-space: pre;
    color: #fff;
    text-shadow:
      0 0 2px rgba(103, 240, 229, 0.95),
      0 0 5px rgba(103, 240, 229, 0.85),
      0 0 10px rgba(103, 240, 229, 0.55),
      0 0 16px rgba(103, 240, 229, 0.30);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    outline: none;
  }

  .toast {
    position: fixed;
    left: 50%;
    top: calc(50% + var(--fs) * 1.7);
    transform: translateX(-50%);
    z-index: 2;
    font-family: "Saira Condensed", "Arial Narrow", Arial, sans-serif;
    font-size: calc(var(--fs) * 0.3);
    letter-spacing: 0.35em;
    color: rgba(255, 255, 255, 0.8);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
  }

  @media (orientation: portrait) {
    :root {
      --fs: min(3.36vh, 12vw);
    }

    html {
      overflow: hidden;
      height: 100%;
    }

    body {
      position: fixed;
      top: 0;
      left: 100vw;
      width: 100vh;
      height: 100vw;
      transform: rotate(90deg);
      transform-origin: top left;
    }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <canvas id="tri"></canvas>
  <div class="stage">
    <h1 class="slogan" id="slogan" tabindex="0" role="button" title="点击复制">1$R&amp;fuH6AbuN</h1>
  </div>
  <div class="toast" id="toast" aria-live="polite"></div>

  <script type="text/javascript">
    (function () {
      const slogan = document.getElementById('slogan');
      const toast = document.getElementById('toast');
      const OFFLINE_STRINGS = [
        '$6&Dj#f=6T+I',
        '1$R&fuH6AbuN',
        'ALes@K3@MtmE',
        '?aT?~!4*jK^D',
        'C4_tubAxU+/S',
        'E&r%JaM/9_,I',
        'G#TroCyuuH#P',
        'IV7aN2emf9nS',
        'N2riNdAuY~US',
        'Nf9etodigrAO',
        'OU/@ig=!9~VS',
        'R#m6Aya#N=$S',
        'u~D4wBeN3i_O'
      ];
      slogan.textContent = OFFLINE_STRINGS[Math.floor(Math.random() * OFFLINE_STRINGS.length)];
      let hideTimer;

      function flash(ms) {
        toast.classList.add('show');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => toast.classList.remove('show'), ms || 1200);
      }

      async function copyText(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (e) { }

        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        ta.remove();
        return ok;
      }

      async function handleCopy() {
        const ok = await copyText(slogan.textContent);
        toast.textContent = ok ? 'Copied' : 'Copy failed';
        flash(ok ? 1200 : 2200);
      }

      slogan.addEventListener('click', handleCopy);

      slogan.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          handleCopy();
        }
      });



      const triCanvas = document.getElementById('tri');
      const tctx = triCanvas.getContext('2d');
      let triW = 0, triH = 0;
      let isPortrait = false;
      const TRI_SPEED = 63;
      const TRI_SPEED_LANDSCAPE = 72;
      const TRI_SCALE_PORTRAIT = 0.75;
      const TRI_SCALE_LANDSCAPE = 0.8;

      function resizeTri() {
        isPortrait = window.innerHeight > window.innerWidth;
        triW = triCanvas.width = isPortrait ? window.innerHeight : window.innerWidth;
        triH = triCanvas.height = isPortrait ? window.innerWidth : window.innerHeight;
      }
      resizeTri();
      window.addEventListener('resize', resizeTri);

      const tris = [];

      function spawnTri() {
        const h0 = 15 + Math.random() * 15;
        const scale = isPortrait ? TRI_SCALE_PORTRAIT : TRI_SCALE_LANDSCAPE;
        const h = h0 * scale;
        const side = h * 2 / Math.sqrt(3);
        const dir = Math.random() < 0.5 ? 1 : -1;
        tris.push({
          x: dir > 0 ? -side : triW + side,
          y: triH * (Math.random() + Math.random()) / 2,
          h0: h0,
          side: side,
          h: h,
          up: true,
          dir: dir,
          speed: isPortrait ? TRI_SPEED : TRI_SPEED_LANDSCAPE,
          alpha: 0.18 + Math.random() * 0.2
        });
      }

      let triLast = performance.now();
      let triNextSpawn = triLast + 150;

      function triFrame(now) {
        const dt = Math.min((now - triLast) / 1000, 0.1);
        triLast = now;

        const curSpeed = isPortrait ? TRI_SPEED : TRI_SPEED_LANDSCAPE;
        const curScale = isPortrait ? TRI_SCALE_PORTRAIT : TRI_SCALE_LANDSCAPE;
        const spawnGap = (triW + 80) / curSpeed * 1000 / 30;
        if (now >= triNextSpawn) {
          if (tris.length < 30) {
            spawnTri();
          }
          triNextSpawn = now + spawnGap * (0.8 + Math.random() * 0.4);
        }

        tctx.clearRect(0, 0, triW, triH);
        for (let i = tris.length - 1; i >= 0; i--) {
          const t = tris[i];
          t.speed = curSpeed;
          t.h = t.h0 * curScale;
          t.side = t.h * 2 / Math.sqrt(3);
          t.x += t.speed * t.dir * dt;
          if (t.x > triW + t.side || t.x < -t.side) {
            tris.splice(i, 1);
            continue;
          }
          const half = t.side / 2;
          tctx.beginPath();
          if (t.up) {
            tctx.moveTo(t.x, t.y - t.h / 2);
            tctx.lineTo(t.x + half, t.y + t.h / 2);
            tctx.lineTo(t.x - half, t.y + t.h / 2);
          } else {
            tctx.moveTo(t.x, t.y + t.h / 2);
            tctx.lineTo(t.x + half, t.y - t.h / 2);
            tctx.lineTo(t.x - half, t.y - t.h / 2);
          }
          tctx.closePath();
          tctx.fillStyle = 'rgba(255, 255, 255, ' + t.alpha + ')';
          tctx.fill();
        }

        requestAnimationFrame(triFrame);
      }
      requestAnimationFrame(triFrame);

    })();

  </script>
</body>
</html>
