<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>Sky of Your Vault</title>
<style>

  :root {
    --phi-cyan-neon:  #31a8ca;
    --phi-cyan-dark:  #1a5c70;
    --phi-bg-panel:   #0a1824;
    --phi-text-main:  #dbe8f5;
    --phi-text-muted: #7e94a8;
    --phi-font: 'SairaCondensed', 'Noto Sans SC', ui-monospace, Consolas, 'Microsoft YaHei', monospace;

    --phi-box-w: 480px;
    --phi-z: 9500;

    --say-w: min(92vw, 720px);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }


  .say-wrap {
    position: fixed;
    left: 50%;
    bottom: 28px;
    z-index: 10;
    width: var(--say-w);
    transform: translate(-50%, 72px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .42s ease,
                transform .58s cubic-bezier(.22, 1, .36, 1),
                visibility .58s;
  }
  .say-wrap.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
    pointer-events: auto;
  }

  .say { display: flex; align-items: stretch; font-family: var(--phi-font); }
  .say.shake { animation: phiShake .3s ease; }

  .say__panel {
    display: flex;
    align-items: stretch;
    flex: 1 1 auto;
    min-width: 0;
    background-color: var(--phi-bg-panel);
    background-image: repeating-linear-gradient(45deg,
        transparent, transparent 2px,
        rgba(255,255,255,.015) 2px, rgba(255,255,255,.015) 4px);
    border: 1px solid var(--phi-cyan-neon);
    border-right: 0;
    border-radius: 0;
    box-shadow: 0 0 22px rgba(49,168,202,.28), inset 0 0 22px rgba(0,0,0,.5);
    clip-path: inset(0 50% 0 50%);
    transition: clip-path .62s cubic-bezier(.22, 1, .36, 1);
  }
  .say-wrap.open .say__panel { clip-path: inset(0 0 0 0); }

  .say__input,
  .say__name {
    min-width: 0;
    padding: 11px 14px;
    background: transparent;
    border: 0;
    border-right: 1px solid var(--phi-cyan-dark);
    border-radius: 0;
    color: var(--phi-text-main);
    font-family: var(--phi-font);
    font-size: 13px;
    letter-spacing: 1.5px;
  }
  .say__input { flex: 1 1 auto; }
  .say__name { flex: 0 0 118px; letter-spacing: 2px; }
  .say__input::placeholder,
  .say__name::placeholder { color: var(--phi-text-muted); opacity: .75; }
  .say__input:focus,
  .say__name:focus {
    outline: none;
    background: rgba(49,168,202,.09);
    box-shadow: inset 0 0 0 1px var(--phi-cyan-dark);
  }

  .say__btn {
    flex: 0 0 auto;
    padding: 0 clamp(16px, 2vw, 28px);
    background-color: var(--phi-cyan-dark);
    background-image: repeating-linear-gradient(45deg,
        transparent, transparent 2px,
        rgba(0,0,0,.12) 2px, rgba(0,0,0,.12) 4px);
    border: 1px solid var(--phi-cyan-neon);
    border-radius: 0;
    color: var(--phi-cyan-neon);
    font-family: var(--phi-font);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 3px;
    cursor: pointer;
    text-shadow: 0 0 5px var(--phi-cyan-neon);
    box-shadow: 0 0 22px rgba(49,168,202,.28);
    transform: translateX(0) scale(1);
    transition: transform .62s cubic-bezier(.3, 1.22, .5, 1),
                background-color .2s, color .2s;
  }

  .say__btn {
    transform: translateX(calc(var(--say-w) / -2 + 50%)) scale(.78);
  }
  .say-wrap.show:not(.open) .say__btn {
    transform: translateX(calc(var(--say-w) / -2 + 50%)) scale(1);
  }
  .say-wrap.open .say__btn {
    transform: translateX(0) scale(1);
    transition: transform .62s cubic-bezier(.22, 1, .36, 1),
                background-color .2s, color .2s;
  }

  .say__btn:hover { background-color: var(--phi-cyan-neon); color: #000; text-shadow: none; }
  .say__btn:active { box-shadow: inset 0 0 22px rgba(0,0,0,.45); }

  .say__btn-label {
    display: inline-block;
    opacity: 0;
    transform: scale(.8);
    transition: opacity .26s ease, transform .34s cubic-bezier(.22, 1, .36, 1);
  }
  .say-wrap.label .say__btn-label { opacity: 1; transform: scale(1); }

  @keyframes phiShake {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-6px); }
    40%      { transform: translateX(5px); }
    60%      { transform: translateX(-3px); }
    80%      { transform: translateX(2px); }
  }

  @media (max-width: 560px) {
    .say__name { flex: 0 0 84px; }
    .say__btn { padding: 0 14px; letter-spacing: 2px; }
    .say__input, .say__name { font-size: 12px; padding: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .say-wrap, .say__panel, .say__btn, .say__btn-label { transition: none; }
    .say.shake { animation: none; }
  }

  .tip {
    position: fixed;
    left: 0; top: 0;
    display: none;
    transform-origin: left center;
    will-change: transform, opacity;
    min-width: 160px;
    max-width: 260px;
    padding: 9px 12px 8px;
    background-color: var(--phi-bg-panel);
    background-image: repeating-linear-gradient(45deg,
        transparent, transparent 2px,
        rgba(255,255,255,.015) 2px, rgba(255,255,255,.015) 4px);
    border: 2px solid var(--phi-cyan-neon);
    border-radius: 0;
    box-shadow: 0 0 22px rgba(49,168,202,.34), inset 0 0 22px rgba(0,0,0,.5);
    font-family: var(--phi-font);
    color: var(--phi-text-main);
    opacity: 0;
    pointer-events: none;
  }

  .tip .tip-msg {
    font-size: 13px;
    line-height: 1.7;
    letter-spacing: .5px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .tip .tip-from {
    margin-top: 7px;
    padding-top: 5px;
    border-top: 1px solid var(--phi-cyan-dark);
    text-align: right;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--phi-text-muted);
  }

  .phi-dialog {
    position: fixed;
    inset: 0;
    z-index: var(--phi-z);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: var(--phi-font);
    -webkit-font-smoothing: antialiased;
  }
  .phi-dialog[hidden] { display: none !important; }

  .phi-dialog__backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.72);
    animation: phiBackdropIn .2s ease-out;
  }

  .phi-dialog__box {
    position: relative;
    width: min(92vw, var(--phi-box-w));
    max-height: min(80vh, 720px);
    display: flex;
    flex-direction: column;
    background-color: var(--phi-bg-panel);
    background-image: repeating-linear-gradient(45deg,
        transparent, transparent 2px,
        rgba(255,255,255,.015) 2px, rgba(255,255,255,.015) 4px);
    border: 2px solid var(--phi-cyan-neon);
    box-shadow: 0 0 30px rgba(49,168,202,.3), inset 0 0 30px rgba(0,0,0,.5);
    animation: phiDialogIn .25s ease-out;
  }

  .phi-dialog__body {
    flex: 1;
    overflow-y: auto;
    padding: clamp(14px, 1.8vw, 24px);
    font-size: clamp(12px, 1.3vw, 15px);
    line-height: 1.8;
    letter-spacing: .5px;
    color: var(--phi-text-main);
  }
  .phi-dialog__body p { margin: 0 0 10px; text-indent: 2em; }
  .phi-dialog__body p:last-child { margin-bottom: 0; }

  .phi-dialog__footer {
    flex-shrink: 0;
    display: flex;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: clamp(8px, 1vw, 14px);
    padding: clamp(10px, 1.2vw, 16px) clamp(14px, 1.8vw, 24px);
    border-top: 1px solid var(--phi-cyan-dark);
  }

  .phi-dialog__btn {
    padding: clamp(6px, .7vw, 10px) clamp(14px, 1.8vw, 24px);
    font-family: var(--phi-font);
    font-size: clamp(11px, 1.2vw, 14px);
    font-weight: 500;
    letter-spacing: 2px;
    cursor: pointer;
    user-select: none;
    transition: all .2s;
    appearance: none;
    border-radius: 0;
  }
  .phi-dialog__btn--ghost {
    background: transparent;
    border: 1px solid var(--phi-text-muted);
    color: var(--phi-text-muted);
  }
  .phi-dialog__btn--ghost:hover { background: var(--phi-text-muted); color: #000; }
  .phi-dialog__btn--primary {
    background: var(--phi-cyan-dark);
    border: 1px solid var(--phi-cyan-neon);
    color: var(--phi-cyan-neon);
    text-shadow: 0 0 5px var(--phi-cyan-neon);
  }
  .phi-dialog__btn--primary:hover { background: var(--phi-cyan-neon); color: #000; text-shadow: none; }

  @keyframes phiBackdropIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes phiDialogIn {
    0%   { opacity: 0; transform: scale(.92) translateY(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes phiDialogOut {
    from { transform: translateY(0) scale(1); }
    to   { transform: translateY(115vh) scale(.12); }
  }
  .phi-dialog--closing .phi-dialog__box {
    animation: phiDialogOut .4s cubic-bezier(.55, .06, .68, .19) forwards;
  }
  .phi-dialog--closing .phi-dialog__backdrop {
    opacity: 0;
    transition: opacity .32s ease;
  }

  @media (prefers-reduced-motion: reduce) {
    .phi-dialog__box,
    .phi-dialog__backdrop,
    .phi-dialog--closing .phi-dialog__box { animation: none !important; }
  }
  @media (max-width: 420px) {
    .phi-dialog__footer { justify-content: stretch; }
    .phi-dialog__btn { flex: 1 1 auto; text-align: center; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="tip" id="tip">
  <div class="tip-msg" id="tip-msg"></div>
  <div class="tip-from" id="tip-from"></div>
</div>

<div class="say-wrap" id="say-wrap">
  <form class="say" id="say" autocomplete="off">
    <div class="say__panel">
      <input class="say__input" id="say-text" type="text" maxlength="130"
             placeholder="向无序的宇宙说点什么……">
      <input class="say__name" id="say-name" type="text" maxlength="16" placeholder="署名">
    </div>
    <button class="say__btn" type="submit"><span class="say__btn-label">发送</span></button>
  </form>
</div>

<div class="phi-dialog" id="end-dialog" hidden>
  <div class="phi-dialog__backdrop" data-close="backdrop"></div>
  <div class="phi-dialog__box" role="dialog" aria-modal="true" aria-label="提示">
    <div class="phi-dialog__body">
    </div>
    <div class="phi-dialog__footer">
      <button class="phi-dialog__btn phi-dialog__btn--primary" data-close="close" type="button">关闭</button>
    </div>
  </div>
</div>
